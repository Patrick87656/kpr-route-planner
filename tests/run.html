<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KPR Route Planner tests</title>
  <!--
    Headless test page. Run it with tests/run-tests.ps1 (or open it in a
    browser). It loads the app modules that don't need Mapbox and never calls
    KPR.app.init(), so no map, token or network is involved.
  -->
</head>
<body>
  <pre id="results">Running…</pre>

  <!-- DOM skeleton: just the element ids that list/render code looks up. -->
  <div id="fixture-dom" hidden>
    <input id="route-name" value="">
    <button id="clear-waypoints">Clear</button>
    <div id="route-status" class="status-box"></div>
    <span id="stat-stops"></span>
    <ol id="waypoint-list"></ol>
    <span id="waypoint-count"></span>
    <p id="itinerary-empty"></p>
    <h2>Scene legend</h2>
    <ul id="scene-legend"></ul>
    <ul id="scene-list"></ul>
    <span id="scene-count"></span>
    <p id="scenes-empty"></p>

    <!-- Share button and dialog, same ids/structure as index.html. -->
    <button id="share-route" aria-disabled="true" title="">Share</button>
    <div id="share-dialog" class="hidden">
      <div class="dialog-box share-box">
        <div id="share-qr-wrap"><canvas id="share-qr" width="1" height="1"></canvas></div>
        <p id="share-qr-fallback" class="hidden"></p>
        <label for="share-link">Link <input id="share-link" type="text" readonly></label>
        <p id="share-long-hint" class="hidden"></p>
        <p id="share-status" role="status"></p>
        <button id="share-close" type="button">Close</button>
        <button id="share-send" type="button" class="hidden">Send</button>
        <button id="share-copy" type="button">Copy link</button>
      </div>
    </div>
  </div>

  <script src="harness.js"></script>
  <script src="../js/waypoints.js"></script>
  <script src="../js/scenes.js"></script>
  <script src="../js/vendor/qrcodegen-v1.8.0-es5.js"></script>
  <script src="../js/route-codec.js"></script>
  <script src="../js/beta.js"></script>
  <script src="../js/ratings.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/share.js"></script>
  <script src="../js/app.js"></script>
  <script src="fixtures/route-fixtures.js"></script>
  <script src="scenes-coords.test.js"></script>
  <script src="storage.test.js"></script>
  <script src="render-audit.test.js"></script>
  <script src="codec.test.js"></script>
  <script src="share-ui.test.js"></script>
  <script src="beta.test.js"></script>
  <script src="results-codec.test.js"></script>
  <script src="ratings.test.js"></script>
  <script src="scene-badge.test.js"></script>
</body>
</html>
